<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Find Nearby — discover what's around you">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.55" stop-color="#121433"/>
      <stop offset="1" stop-color="#2a1240"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef0ff"/>
      <stop offset="0.55" stop-color="#7c9cff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c9cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c9cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="frame"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#fff">
      <circle cx="80" cy="60" r="1.2" opacity=".7"/><circle cx="210" cy="340" r="1" opacity=".5"/>
      <circle cx="420" cy="40" r="1.4" opacity=".6"><animate attributeName="opacity" values=".6;.1;.6" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="360" r="1" opacity=".5"/><circle cx="700" cy="30" r="1.2" opacity=".7"/>
      <circle cx="1220" cy="70" r="1.3" opacity=".6"><animate attributeName="opacity" values=".6;.15;.6" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="1180" cy="350" r="1" opacity=".5"/><circle cx="640" cy="200" r="0.9" opacity=".4"/>
      <circle cx="40" cy="250" r="1.1" opacity=".5"/><circle cx="330" cy="110" r="0.9" opacity=".4"/>
    </g>

    <!-- walk rings (5 / 10 / 15 min) around the user -->
    <g transform="translate(960 210)">
      <circle r="190" fill="url(#glow)"/>
      <g fill="none" stroke-width="1.5" stroke-dasharray="5 6">
        <circle r="60" stroke="#38bdf8" opacity=".8"/>
        <circle r="115" stroke="#818cf8" opacity=".6">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
        </circle>
        <circle r="170" stroke="#c084fc" opacity=".45">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="90s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- walking route -->
      <path d="M0 0 L40 25 L95 18 L120 -40 L150 -70" fill="none" stroke="url(#route)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="260" stroke-dashoffset="260">
        <animate attributeName="stroke-dashoffset" values="260;0;0;260" keyTimes="0;.35;.85;1" dur="5s" repeatCount="indefinite"/>
      </path>

      <!-- user dot -->
      <circle r="9" fill="#38bdf8">
        <animate attributeName="r" values="9;34" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".6;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle r="9" fill="#38bdf8" stroke="#fff" stroke-width="3"/>

      <!-- pins -->
      <g font-size="17" text-anchor="middle" dominant-baseline="central">
        <g transform="translate(150 -70)">
          <circle r="26" fill="#ec4899" filter="url(#blur)" opacity=".8"/>
          <circle r="20" fill="#ec4899" stroke="#fff" stroke-width="2.5"/><text>🍸</text>
        </g>
        <g transform="translate(-95 -60)">
          <circle r="22" fill="#f59e0b" filter="url(#blur)" opacity=".7"/>
          <circle r="16" fill="#f59e0b" stroke="#fff" stroke-width="2"/><text font-size="13">📸</text>
        </g>
        <g transform="translate(-140 70)">
          <circle r="22" fill="#22c55e" filter="url(#blur)" opacity=".7"/>
          <circle r="16" fill="#22c55e" stroke="#fff" stroke-width="2"/><text font-size="13">🌳</text>
        </g>
        <g transform="translate(70 120)">
          <circle r="22" fill="#d97706" filter="url(#blur)" opacity=".7"/>
          <circle r="16" fill="#d97706" stroke="#fff" stroke-width="2"/><text font-size="13">☕</text>
        </g>
        <g transform="translate(200 60)">
          <circle r="22" fill="#8b5cf6" filter="url(#blur)" opacity=".7"/>
          <circle r="16" fill="#8b5cf6" stroke="#fff" stroke-width="2"/><text font-size="13">🏛️</text>
        </g>
        <g transform="translate(-30 -150)">
          <circle r="22" fill="#f43f5e" filter="url(#blur)" opacity=".7"/>
          <circle r="16" fill="#f43f5e" stroke="#fff" stroke-width="2"/><text font-size="13">🍜</text>
        </g>
      </g>
    </g>

    <!-- copy -->
    <g font-family="'Space Grotesk', Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="80" y="128" fill="#7c9cff" font-size="16" font-weight="600" letter-spacing="4">JUST LANDED?</text>
      <text x="76" y="212" fill="url(#title)" font-size="86" font-weight="700" letter-spacing="-2">Find Nearby</text>
      <text x="80" y="262" fill="#b8bde0" font-size="24">Discover what's around you — in one tap.</text>
      <text x="80" y="310" fill="#8a90b8" font-size="16">3D maps  ·  live walking routes  ·  day ↔ night that follows your clock</text>
    </g>
  </g>
</svg>
