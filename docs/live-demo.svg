<svg xmlns="http://www.w3.org/2000/svg" width="330" height="96" viewBox="0 0 330 96" role="img" aria-label="Try it live at find-nearby.vercel.app">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.55" stop-color="#121433"/>
      <stop offset="1" stop-color="#2a1240"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#7c9cff"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef0ff"/>
      <stop offset="0.6" stop-color="#7c9cff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="328" height="94" rx="47" fill="url(#sky)" stroke="url(#edge)" stroke-width="2"/>

  <!-- a few stars, like the banner -->
  <g fill="#fff">
    <circle cx="286" cy="22" r="1.1" opacity=".6"><animate attributeName="opacity" values=".6;.15;.6" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="304" cy="66" r="1" opacity=".4"/>
    <circle cx="266" cy="80" r="1.2" opacity=".5"><animate attributeName="opacity" values=".5;.1;.5" dur="4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- pulsing "you are here" pin -->
  <circle cx="48" cy="48" r="22" fill="none" stroke="#38bdf8" stroke-width="2" opacity=".6">
    <animate attributeName="r" values="22;34" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".6;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="48" cy="48" r="24" fill="url(#pin)"/>
  <path d="M48 35c-6.1 0-11 4.8-11 10.8C37 53.9 48 63 48 63s11-9.1 11-17.2C59 39.8 54.1 35 48 35zm0 15a4.2 4.2 0 1 1 0-8.4 4.2 4.2 0 0 1 0 8.4z" fill="#fff"/>

  <text x="88" y="46" font-family="'Space Grotesk', Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="url(#title)">Try it live</text>
  <text x="88" y="70" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9aa0c3">find-nearby.vercel.app  →</text>
</svg>
